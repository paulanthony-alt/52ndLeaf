<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>52nd Leaf — Add this week's photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F1EA}
a{color:#3F5A3C}a:hover{color:#2C4029}
input,textarea{font:inherit}
a,button,input,textarea,label{transition:background-color .2s ease-out,color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out}
.btn-primary:hover{background:#2C4029!important}
.drop:hover{background:#E6EBDD!important;border-color:#3F5A3C!important}
input:hover,textarea:hover{border-color:#9C9684!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3F5A3C;outline-offset:2px}
.drop:has(+ input:focus-visible){outline:2px solid #3F5A3C;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F1EA; color: #2B2B28; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 32px; box-sizing: border-box">

<header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 28px 0">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2B2B28">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3F5A3C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8.3 5.7-14 14-14 0 8.3-5.7 14-14 14z"></path><path d="M5 19l8-8"></path></svg>
<span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">52nd Leaf</span>
</a>
<a href="Journal.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 12px 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
Back to journal
</a>
</header>

<section style="padding: 40px 0 96px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">

<div style="flex: 1 1 440px; min-width: 0">
<label for="photo" class="drop" style="aspect-ratio: 4 / 5; border-radius: 24px; border: 1.5px dashed #9DB58A; background: #ECEADF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #3F5A3C; cursor: pointer; text-align: center; padding: 24px; box-sizing: border-box">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"></rect><circle cx="12" cy="12.5" r="3.5"></circle><path d="M8 5l1.5-2h5L16 5"></path></svg>
<span style="font-size: 17px; font-weight: 500">Add your photo</span>
<span style="font-size: 14px; color: #55544D">Drag it here or tap to choose</span>
</label>
<input id="photo" type="file" accept="image/*" style="position: absolute; width: 1px; height: 1px; opacity: 0">
</div>

<form style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #3F5A3C">Week 47 · Nov 16–22</p>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 48px; line-height: 1.08; letter-spacing: -0.02em">What did you notice this week?</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="note" style="font-size: 14px; font-weight: 600">Note</label>
<textarea id="note" rows="4" placeholder="The maple by the trail finally dropped its last leaves…" style="border: 1px solid #CFC9BA; border-radius: 12px; background: #FBFAF6; padding: 14px 16px; font-size: 16px; line-height: 1.5; color: #2B2B28; resize: vertical"></textarea>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 8px">
<label for="place" style="font-size: 14px; font-weight: 600">Where</label>
<input id="place" type="text" placeholder="Trail, park, backyard" style="border: 1px solid #CFC9BA; border-radius: 12px; background: #FBFAF6; padding: 14px 16px; font-size: 16px; color: #2B2B28">
</div>
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 8px">
<label for="weather" style="font-size: 14px; font-weight: 600">Weather</label>
<input id="weather" type="text" placeholder="Cool, overcast" style="border: 1px solid #CFC9BA; border-radius: 12px; background: #FBFAF6; padding: 14px 16px; font-size: 16px; color: #2B2B28">
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-top: 4px">
<button type="submit" class="btn-primary" style="border: 0; background: #3F5A3C; color: #FFFFFF; padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 16px; cursor: pointer">Save this week's leaf</button>
<span style="font-size: 14px; color: #6B6A63">One photo per week</span>
</div>
</form>

</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
