<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>52nd Leaf — Empty journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F1EA}
a{color:#3F5A3C}a:hover{color:#2C4029}
a,button{cursor:pointer;transition:background-color .2s ease-out,color .2s ease-out}
.btn-primary:hover{background:#2C4029!important}
a:focus-visible,button:focus-visible{outline:2px solid #3F5A3C;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F1EA; color: #2B2B28; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 32px; box-sizing: border-box">

<header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 28px 0">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2B2B28">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3F5A3C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8.3 5.7-14 14-14 0 8.3-5.7 14-14 14z"></path><path d="M5 19l8-8"></path></svg>
<span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">52nd Leaf</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px">
<a href="Journal.dc.html" aria-current="page" style="text-decoration: none; color: #3F5A3C; font-weight: 600">Journal</a>
<a href="Main.dc.html#how" style="text-decoration: none; color: #2B2B28">How it works</a>
</nav>
</header>

<section style="padding: 72px 0 96px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px">
<div style="width: 96px; height: 96px; border-radius: 50%; background: #E3E8D8; display: flex; align-items: center; justify-content: center; color: #3F5A3C">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8.3 5.7-14 14-14 0 8.3-5.7 14-14 14z"></path><path d="M5 19l8-8"></path></svg>
</div>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 52px; line-height: 1.08; letter-spacing: -0.02em; max-width: 640px">Your first leaf starts here.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #55544D; max-width: 520px">Add one nature photo this week. Your journal fills in one square at a time until you have 52.</p>
<a href="Entry.dc.html" class="btn-primary" style="text-decoration: none; background: #3F5A3C; color: #FFFFFF; padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 16px">Add your first photo</a>
<div style="margin-top: 24px; max-width: 520px; border-radius: 16px; background: #ECEADF; padding: 18px 22px; display: flex; gap: 14px; align-items: flex-start; text-align: left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3F5A3C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3E3D38">Tip: pick a spot you pass often, like the same tree or the same view, so you can watch it change through the year.</p>
</div>
</section>

<section aria-label="52 empty weeks" style="padding: 0 0 96px">
<div style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{weeks}}" as="w" hint-placeholder-count="52">
<div style="aspect-ratio: 1 / 1; border-radius: 8px; border: 1px solid #DDD7C9; box-sizing: border-box"></div>
</sc-for>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const weeks = [];
for (let i = 1; i <= 52; i++) weeks.push({ n: i });
return { weeks };
}
}
</script>
</body>
</html>
